# Employee Management System - MERN stack with Docker Compose
# Services: frontend (React + Nginx) -> backend (Express) -> mongodb (official image)

services:
  mongodb:
    image: mongo:7.0
    container_name: employee-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Copy .env.example to .env first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Copy .env.example to .env first}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-employee_db}
    volumes:
      - mongodb_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    networks:
      - employee_net
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: "5000"
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-employee_db}
      MONGO_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_FILE: /seed/sample-employees.json
    volumes:
      - ./database/sample-employees.json:/seed/sample-employees.json:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    networks:
      - employee_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - employee_net

networks:
  employee_net:
    driver: bridge

volumes:
  mongodb_data:
    name: mongodb_data
